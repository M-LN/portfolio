<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <!-- Flask Icon -->
  <g transform="translate(50, 50)">
    <path d="M80 40 L80 80 L40 160 L160 160 L120 80 L120 40 Z" fill="#ffffff" opacity="0.9"/>
    <rect x="75" y="30" width="10" height="15" fill="#ffffff" opacity="0.9"/>
    <rect x="115" y="30" width="10" height="15" fill="#ffffff" opacity="0.9"/>
    <circle cx="100" cy="120" r="8" fill="#60a5fa"/>
  </g>
  
  <!-- Report/Document Icons -->
  <g transform="translate(220, 60)">
    <rect x="0" y="0" width="120" height="160" fill="#ffffff" rx="8" opacity="0.95"/>
    <rect x="15" y="20" width="90" height="8" fill="#3b82f6" opacity="0.7"/>
    <rect x="15" y="35" width="70" height="6" fill="#6b7280" opacity="0.5"/>
    <rect x="15" y="50" width="85" height="6" fill="#6b7280" opacity="0.5"/>
    <rect x="15" y="65" width="60" height="6" fill="#6b7280" opacity="0.5"/>
    
    <!-- Chart representation -->
    <rect x="15" y="90" width="90" height="60" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
    <polyline points="25,135 35,125 45,130 55,115 65,120 75,105 85,110 95,100" 
              fill="none" stroke="#3b82f6" stroke-width="2"/>
  </g>
  
  <!-- Azure/Cloud elements -->
  <g transform="translate(20, 200)">
    <ellipse cx="30" cy="20" rx="25" ry="12" fill="#ffffff" opacity="0.8"/>
    <ellipse cx="60" cy="25" rx="20" ry="10" fill="#ffffff" opacity="0.6"/>
    <ellipse cx="90" cy="22" rx="22" ry="11" fill="#ffffff" opacity="0.7"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="280" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    Flask ADX Report Generator
  </text>
</svg>
