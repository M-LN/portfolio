<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#mlBg)"/>
  
  <!-- Neural Network Visualization -->
  <!-- Input Layer -->
  <g transform="translate(50, 50)">
    <circle cx="0" cy="20" r="8" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="50" r="8" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="80" r="8" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="110" r="8" fill="#ffffff" opacity="0.9"/>
    <text x="0" y="140" text-anchor="middle" fill="#ffffff" font-size="10">Input</text>
  </g>
  
  <!-- Hidden Layer 1 -->
  <g transform="translate(130, 40)">
    <circle cx="0" cy="15" r="8" fill="#ffffff" opacity="0.8"/>
    <circle cx="0" cy="35" r="8" fill="#ffffff" opacity="0.8"/>
    <circle cx="0" cy="55" r="8" fill="#ffffff" opacity="0.8"/>
    <circle cx="0" cy="75" r="8" fill="#ffffff" opacity="0.8"/>
    <circle cx="0" cy="95" r="8" fill="#ffffff" opacity="0.8"/>
    <circle cx="0" cy="115" r="8" fill="#ffffff" opacity="0.8"/>
    <text x="0" y="135" text-anchor="middle" fill="#ffffff" font-size="10">LSTM</text>
  </g>
  
  <!-- Hidden Layer 2 -->
  <g transform="translate(210, 50)">
    <circle cx="0" cy="20" r="8" fill="#ffffff" opacity="0.7"/>
    <circle cx="0" cy="45" r="8" fill="#ffffff" opacity="0.7"/>
    <circle cx="0" cy="70" r="8" fill="#ffffff" opacity="0.7"/>
    <circle cx="0" cy="95" r="8" fill="#ffffff" opacity="0.7"/>
    <text x="0" y="125" text-anchor="middle" fill="#ffffff" font-size="10">Hidden</text>
  </g>
  
  <!-- Output Layer -->
  <g transform="translate(290, 70)">
    <circle cx="0" cy="20" r="10" fill="#fbbf24" opacity="0.9"/>
    <circle cx="0" cy="50" r="10" fill="#fbbf24" opacity="0.9"/>
    <text x="0" y="85" text-anchor="middle" fill="#ffffff" font-size="10">Output</text>
  </g>
  
  <!-- Connections -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.3" fill="none">
    <!-- Input to LSTM -->
    <line x1="58" y1="70" x2="122" y2="55"/>
    <line x1="58" y1="80" x2="122" y2="75"/>
    <line x1="58" y1="100" x2="122" y2="95"/>
    <line x1="58" y1="130" x2="122" y2="115"/>
    
    <!-- LSTM to Hidden -->
    <line x1="138" y1="55" x2="202" y2="70"/>
    <line x1="138" y1="75" x2="202" y2="95"/>
    <line x1="138" y1="95" x2="202" y2="115"/>
    <line x1="138" y1="115" x2="202" y2="145"/>
    
    <!-- Hidden to Output -->
    <line x1="218" y1="70" x2="282" y2="90"/>
    <line x1="218" y1="95" x2="282" y2="120"/>
  </g>
  
  <!-- Temperature Wave -->
  <g transform="translate(50, 200)">
    <path d="M0,30 Q50,10 100,30 T200,30 T300,30" stroke="#fbbf24" stroke-width="3" fill="none" opacity="0.8"/>
    <text x="150" y="55" text-anchor="middle" fill="#ffffff" font-size="12">Temperature Data</text>
  </g>
  
  <!-- Title -->
  <text x="200" y="280" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    LSTM Steady State Detection
  </text>
</svg>
