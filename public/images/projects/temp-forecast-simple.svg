<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="200" y="40" text-anchor="middle" fill="white" font-size="18" font-weight="bold">Temperature Forecasting</text>
  <text x="200" y="65" text-anchor="middle" fill="white" font-size="14">with Darts &amp; LSTM</text>
  
  <!-- Chart Area -->
  <rect x="50" y="90" width="300" height="160" fill="white" fill-opacity="0.9" rx="8"/>
  
  <!-- Chart Line -->
  <path d="M 70 200 Q 120 180 170 160 Q 220 140 270 120 Q 320 100 350 80" 
        stroke="#ef4444" stroke-width="3" fill="none"/>
  
  <!-- Forecast Line -->
  <path d="M 220 140 Q 270 130 320 110 Q 350 90 370 70" 
        stroke="#3b82f6" stroke-width="3" fill="none" stroke-dasharray="8,4"/>
  
  <!-- Data Points -->
  <circle cx="170" cy="160" r="5" fill="#ef4444"/>
  <circle cx="220" cy="140" r="5" fill="#ef4444"/>
  <circle cx="270" cy="120" r="5" fill="#3b82f6"/>
  <circle cx="320" cy="110" r="5" fill="#3b82f6"/>
  
  <!-- Legend -->
  <g transform="translate(70, 270)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#ef4444" stroke-width="3"/>
    <text x="25" y="5" fill="white" font-size="12">Historical</text>
    
    <line x1="120" y1="0" x2="140" y2="0" stroke="#3b82f6" stroke-width="3" stroke-dasharray="8,4"/>
    <text x="145" y="5" fill="white" font-size="12">Forecast</text>
  </g>
  
  <!-- Neural Network Symbol -->
  <g transform="translate(320, 180)">
    <circle cx="0" cy="0" r="8" fill="#fbbf24"/>
    <circle cx="25" cy="-15" r="8" fill="#fbbf24"/>
    <circle cx="25" cy="15" r="8" fill="#fbbf24"/>
    <circle cx="50" cy="0" r="8" fill="#fbbf24"/>
    
    <line x1="8" y1="0" x2="17" y2="-15" stroke="white" stroke-width="2"/>
    <line x1="8" y1="0" x2="17" y2="15" stroke="white" stroke-width="2"/>
    <line x1="33" y1="-15" x2="42" y2="0" stroke="white" stroke-width="2"/>
    <line x1="33" y1="15" x2="42" y2="0" stroke="white" stroke-width="2"/>
  </g>
</svg>
