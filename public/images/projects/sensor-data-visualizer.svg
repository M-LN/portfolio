<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sensorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#sensorBg)"/>
  
  <!-- Main Application Window -->
  <g transform="translate(20, 20)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="360" height="220" fill="#ffffff" rx="8" stroke="#e5e7eb" stroke-width="2"/>
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="360" height="25" fill="#f3f4f6" rx="8"/>
    <rect x="0" y="12" width="360" height="13" fill="#f3f4f6"/>
    
    <!-- Window Controls -->
    <circle cx="12" cy="12" r="4" fill="#ef4444"/>
    <circle cx="25" cy="12" r="4" fill="#f59e0b"/>
    <circle cx="38" cy="12" r="4" fill="#10b981"/>
    
    <!-- Title -->
    <text x="180" y="17" text-anchor="middle" fill="#374151" font-size="11" font-weight="bold">
      Sensor Data Visualizer
    </text>
    
    <!-- Left Panel - File List -->
    <rect x="10" y="35" width="120" height="175" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <text x="70" y="50" text-anchor="middle" fill="#374151" font-size="10" font-weight="bold">Data Files</text>
    
    <!-- File List Items -->
    <rect x="15" y="55" width="110" height="15" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="20" y="65" fill="#374151" font-size="8">📊 sensor_data_01.csv</text>
    
    <rect x="15" y="75" width="110" height="15" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="20" y="85" fill="#1d4ed8" font-size="8">📈 temp_readings.tdms</text>
    
    <rect x="15" y="95" width="110" height="15" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="20" y="105" fill="#374151" font-size="8">📋 test_data.xlsx</text>
    
    <!-- Upload Button -->
    <rect x="15" y="125" width="110" height="20" fill="#3b82f6" rx="4"/>
    <text x="70" y="137" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="bold">Upload Data</text>
    
    <!-- ML Analysis Section -->
    <text x="70" y="160" text-anchor="middle" fill="#374151" font-size="9" font-weight="bold">ML Analysis</text>
    <rect x="15" y="165" width="50" height="15" fill="#7c3aed" rx="2"/>
    <text x="40" y="175" text-anchor="middle" fill="#ffffff" font-size="7">Anomaly</text>
    <rect x="75" y="165" width="50" height="15" fill="#059669" rx="2"/>
    <text x="100" y="175" text-anchor="middle" fill="#ffffff" font-size="7">Predict</text>
    
    <rect x="15" y="185" width="50" height="15" fill="#dc2626" rx="2"/>
    <text x="40" y="195" text-anchor="middle" fill="#ffffff" font-size="7">Cluster</text>
    <rect x="75" y="185" width="50" height="15" fill="#f59e0b" rx="2"/>
    <text x="100" y="195" text-anchor="middle" fill="#ffffff" font-size="7">Forecast</text>
    
    <!-- Main Plot Area -->
    <rect x="140" y="35" width="210" height="150" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    
    <!-- Plot Grid -->
    <g stroke="#f3f4f6" stroke-width="0.5">
      <line x1="140" y1="55" x2="350" y2="55"/>
      <line x1="140" y1="75" x2="350" y2="75"/>
      <line x1="140" y1="95" x2="350" y2="95"/>
      <line x1="140" y1="115" x2="350" y2="115"/>
      <line x1="140" y1="135" x2="350" y2="135"/>
      <line x1="140" y1="155" x2="350" y2="155"/>
      <line x1="140" y1="175" x2="350" y2="175"/>
      
      <line x1="160" y1="35" x2="160" y2="185"/>
      <line x1="190" y1="35" x2="190" y2="185"/>
      <line x1="220" y1="35" x2="220" y2="185"/>
      <line x1="250" y1="35" x2="250" y2="185"/>
      <line x1="280" y1="35" x2="280" y2="185"/>
      <line x1="310" y1="35" x2="310" y2="185"/>
      <line x1="340" y1="35" x2="340" y2="185"/>
    </g>
    
    <!-- Scatter Plot Data -->
    <g fill="#3b82f6" opacity="0.7">
      <circle cx="150" cy="165" r="2"/>
      <circle cx="155" cy="155" r="2"/>
      <circle cx="165" cy="145" r="2"/>
      <circle cx="175" cy="135" r="2"/>
      <circle cx="185" cy="125" r="2"/>
      <circle cx="195" cy="115" r="2"/>
      <circle cx="205" cy="105" r="2"/>
      <circle cx="215" cy="95" r="2"/>
      <circle cx="225" cy="85" r="2"/>
      <circle cx="235" cy="75" r="2"/>
      <circle cx="245" cy="70" r="2"/>
      <circle cx="255" cy="65" r="2"/>
      <circle cx="265" cy="60" r="2"/>
      <circle cx="275" cy="55" r="2"/>
      <circle cx="285" cy="52" r="2"/>
      <circle cx="295" cy="50" r="2"/>
      <circle cx="305" cy="48" r="2"/>
      <circle cx="315" cy="47" r="2"/>
      <circle cx="325" cy="46" r="2"/>
      <circle cx="335" cy="45" r="2"/>
    </g>
    
    <!-- Anomaly Points -->
    <g fill="#ef4444" opacity="0.9">
      <circle cx="180" cy="170" r="3"/>
      <circle cx="220" cy="120" r="3"/>
      <circle cx="280" cy="40" r="3"/>
    </g>
    
    <!-- Plot Labels -->
    <text x="245" y="200" text-anchor="middle" fill="#374151" font-size="9">Time</text>
    <text x="130" y="115" text-anchor="middle" fill="#374151" font-size="9" transform="rotate(-90, 130, 115)">Sensor Value</text>
    
    <!-- Control Panel -->
    <rect x="140" y="195" width="210" height="15" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <text x="150" y="205" fill="#374151" font-size="8">X: Time  Y: Temperature  Color: Sensor_ID</text>
  </g>
  
  <!-- File Format Icons -->
  <g transform="translate(20, 250)">
    <rect x="0" y="0" width="25" height="20" fill="#ffffff" rx="2" opacity="0.9"/>
    <text x="12" y="12" text-anchor="middle" fill="#dc2626" font-size="8">CSV</text>
    
    <rect x="30" y="0" width="25" height="20" fill="#ffffff" rx="2" opacity="0.9"/>
    <text x="42" y="12" text-anchor="middle" fill="#dc2626" font-size="8">XLS</text>
    
    <rect x="60" y="0" width="30" height="20" fill="#ffffff" rx="2" opacity="0.9"/>
    <text x="75" y="12" text-anchor="middle" fill="#dc2626" font-size="7">TDMS</text>
  </g>
  
  <!-- Title -->
  <text x="200" y="285" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    Sensor Data Visualizer
  </text>
</svg>
