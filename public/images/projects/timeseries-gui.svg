<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="guiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#guiBg)"/>
  
  <!-- Desktop Application Window -->
  <g transform="translate(30, 30)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="340" height="220" fill="#ffffff" rx="8" stroke="#e5e7eb" stroke-width="2"/>
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="340" height="30" fill="#f3f4f6" rx="8"/>
    <rect x="0" y="15" width="340" height="15" fill="#f3f4f6"/>
    
    <!-- Window Controls -->
    <circle cx="15" cy="15" r="5" fill="#ef4444"/>
    <circle cx="30" cy="15" r="5" fill="#f59e0b"/>
    <circle cx="45" cy="15" r="5" fill="#10b981"/>
    
    <!-- Title -->
    <text x="170" y="20" text-anchor="middle" fill="#374151" font-size="12" font-weight="bold">
      Timeseries Analysis Tool
    </text>
    
    <!-- Menu Bar -->
    <rect x="10" y="35" width="320" height="20" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <text x="20" y="47" fill="#374151" font-size="10">File  Edit  View  Analysis  Tools  Help</text>
    
    <!-- Toolbar -->
    <rect x="10" y="60" width="320" height="25" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="15" y="65" width="15" height="15" fill="#3b82f6" rx="2"/>
    <rect x="35" y="65" width="15" height="15" fill="#10b981" rx="2"/>
    <rect x="55" y="65" width="15" height="15" fill="#f59e0b" rx="2"/>
    <rect x="75" y="65" width="15" height="15" fill="#ef4444" rx="2"/>
    
    <!-- Main Content Area with Chart -->
    <rect x="10" y="90" width="220" height="120" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    
    <!-- Chart Grid -->
    <g stroke="#f3f4f6" stroke-width="0.5">
      <line x1="10" y1="110" x2="230" y2="110"/>
      <line x1="10" y1="130" x2="230" y2="130"/>
      <line x1="10" y1="150" x2="230" y2="150"/>
      <line x1="10" y1="170" x2="230" y2="170"/>
      <line x1="10" y1="190" x2="230" y2="190"/>
      
      <line x1="30" y1="90" x2="30" y2="210"/>
      <line x1="70" y1="90" x2="70" y2="210"/>
      <line x1="110" y1="90" x2="110" y2="210"/>
      <line x1="150" y1="90" x2="150" y2="210"/>
      <line x1="190" y1="90" x2="190" y2="210"/>
    </g>
    
    <!-- Timeseries Data Line -->
    <polyline points="15,180 25,170 35,175 45,160 55,165 65,150 75,155 85,140 95,145 105,130 115,135 125,120 135,125 145,110 155,115 165,100 175,105 185,95 195,100 205,85 215,90 225,80" 
              fill="none" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- Side Panel -->
    <rect x="240" y="90" width="90" height="120" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <text x="285" y="105" text-anchor="middle" fill="#374151" font-size="10" font-weight="bold">Statistics</text>
    <text x="250" y="120" fill="#6b7280" font-size="8">Mean: 42.5</text>
    <text x="250" y="132" fill="#6b7280" font-size="8">Std: 8.2</text>
    <text x="250" y="144" fill="#6b7280" font-size="8">Min: 18.1</text>
    <text x="250" y="156" fill="#6b7280" font-size="8">Max: 67.3</text>
    
    <text x="285" y="175" text-anchor="middle" fill="#374151" font-size="10" font-weight="bold">Filters</text>
    <rect x="250" y="185" width="70" height="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="255" y="193" fill="#6b7280" font-size="8">Moving Avg</text>
  </g>
  
  <!-- Python/Tkinter Logo Elements -->
  <g transform="translate(350, 240)">
    <rect x="0" y="0" width="40" height="25" fill="#ffffff" rx="4" opacity="0.9"/>
    <text x="20" y="16" text-anchor="middle" fill="#059669" font-size="10" font-weight="bold">Py</text>
  </g>
  
  <!-- Title -->
  <text x="200" y="280" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    Timeseries Data Analysis GUI
  </text>
</svg>
