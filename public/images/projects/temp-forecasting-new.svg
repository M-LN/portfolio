<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tempBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#tempBg)"/>
  
  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Temperature Forecasting</text>
  <text x="200" y="50" text-anchor="middle" fill="white" font-size="12">with Darts & LSTM</text>
  
  <!-- Chart Background -->
  <rect x="40" y="70" width="320" height="180" fill="white" fill-opacity="0.9" rx="8"/>
  
  <!-- Chart Grid Lines -->
  <g stroke="#e5e7eb" stroke-width="1" opacity="0.5">
    <line x1="60" y1="90" x2="340" y2="90"/>
    <line x1="60" y1="130" x2="340" y2="130"/>
    <line x1="60" y1="170" x2="340" y2="170"/>
    <line x1="60" y1="210" x2="340" y2="210"/>
    
    <line x1="100" y1="80" x2="100" y2="230"/>
    <line x1="160" y1="80" x2="160" y2="230"/>
    <line x1="220" y1="80" x2="220" y2="230"/>
    <line x1="280" y1="80" x2="280" y2="230"/>
  </g>
  
  <!-- Historical Data Line -->
  <path d="M 60 200 Q 80 180 100 160 Q 120 140 140 150 Q 160 160 180 130 Q 200 100 220 120" 
        stroke="#ef4444" stroke-width="3" fill="none"/>
  
  <!-- Forecast Line -->
  <path d="M 220 120 Q 240 110 260 100 Q 280 90 300 95 Q 320 100 340 85" 
        stroke="#3b82f6" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
  
  <!-- Confidence Interval -->
  <path d="M 220 120 Q 240 100 260 85 Q 280 70 300 75 Q 320 80 340 65 L 340 105 Q 320 120 300 115 Q 280 110 260 115 Q 240 120 220 120 Z" 
        fill="url(#chartGradient)" opacity="0.3"/>
  
  <!-- Data Points -->
  <circle cx="100" cy="160" r="4" fill="#ef4444"/>
  <circle cx="140" cy="150" r="4" fill="#ef4444"/>
  <circle cx="180" cy="130" r="4" fill="#ef4444"/>
  <circle cx="220" cy="120" r="4" fill="#ef4444"/>
  
  <!-- Forecast Points -->
  <circle cx="260" cy="100" r="4" fill="#3b82f6"/>
  <circle cx="300" cy="95" r="4" fill="#3b82f6"/>
  <circle cx="340" cy="85" r="4" fill="#3b82f6"/>
  
  <!-- Legend -->
  <g transform="translate(60, 260)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#ef4444" stroke-width="3"/>
    <text x="25" y="5" fill="white" font-size="12">Historical</text>
    
    <line x1="100" y1="0" x2="120" y2="0" stroke="#3b82f6" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="125" y="5" fill="white" font-size="12">Forecast</text>
    
    <rect x="200" y="-8" width="16" height="16" fill="#3b82f6" opacity="0.3"/>
    <text x="220" y="5" fill="white" font-size="12">Confidence</text>
  </g>
  
  <!-- Neural Network Icon -->
  <g transform="translate(350, 120)">
    <!-- Nodes -->
    <circle cx="0" cy="0" r="6" fill="#fbbf24" stroke="white" stroke-width="2"/>
    <circle cx="20" cy="-15" r="6" fill="#fbbf24" stroke="white" stroke-width="2"/>
    <circle cx="20" cy="15" r="6" fill="#fbbf24" stroke="white" stroke-width="2"/>
    <circle cx="40" cy="0" r="6" fill="#fbbf24" stroke="white" stroke-width="2"/>
    
    <!-- Connections -->
    <line x1="6" y1="0" x2="14" y2="-15" stroke="white" stroke-width="2"/>
    <line x1="6" y1="0" x2="14" y2="15" stroke="white" stroke-width="2"/>
    <line x1="26" y1="-15" x2="34" y2="0" stroke="white" stroke-width="2"/>
    <line x1="26" y1="15" x2="34" y2="0" stroke="white" stroke-width="2"/>
  </g>
  
  <!-- Temperature Scale -->
  <text x="25" y="95" fill="#6b7280" font-size="10">°C</text>
  <text x="25" y="135" fill="#6b7280" font-size="10">25</text>
  <text x="25" y="175" fill="#6b7280" font-size="10">20</text>
  <text x="25" y="215" fill="#6b7280" font-size="10">15</text>
  
  <!-- Time Scale -->
  <text x="95" y="245" fill="#6b7280" font-size="10">Time</text>
  <text x="155" y="245" fill="#6b7280" font-size="10">→</text>
  <text x="315" y="245" fill="#6b7280" font-size="10">Future</text>
</svg>
