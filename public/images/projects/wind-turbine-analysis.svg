<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="turbineBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#turbineBg)"/>
  
  <!-- Wind Turbine -->
  <g transform="translate(50, 80)">
    <!-- Tower -->
    <rect x="48" y="100" width="4" height="80" fill="#ffffff" opacity="0.9"/>
    
    <!-- Nacelle -->
    <ellipse cx="50" cy="100" rx="8" ry="4" fill="#ffffff" opacity="0.9"/>
    
    <!-- Blades -->
    <g transform="translate(50, 100)">
      <!-- Blade 1 -->
      <path d="M0,0 L-2,-40 L0,-42 L2,-40 Z" fill="#ffffff" opacity="0.8"/>
      <!-- Blade 2 (120 degrees) -->
      <path d="M0,0 L34.6,-20 L36.6,-18 L34.6,-16 Z" fill="#ffffff" opacity="0.8"/>
      <!-- Blade 3 (240 degrees) -->
      <path d="M0,0 L-34.6,-20 L-36.6,-18 L-34.6,-16 Z" fill="#ffffff" opacity="0.8"/>
      <!-- Hub -->
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    </g>
  </g>
  
  <!-- Capability Envelope Chart -->
  <g transform="translate(150, 60)">
    <!-- Chart Background -->
    <rect x="0" y="0" width="200" height="150" fill="#ffffff" rx="8" opacity="0.95"/>
    
    <!-- Grid -->
    <g stroke="#e5e7eb" stroke-width="0.5" opacity="0.7">
      <line x1="20" y1="20" x2="20" y2="130"/>
      <line x1="20" y1="130" x2="180" y2="130"/>
      <line x1="50" y1="130" x2="50" y2="125"/>
      <line x1="80" y1="130" x2="80" y2="125"/>
      <line x1="110" y1="130" x2="110" y2="125"/>
      <line x1="140" y1="130" x2="140" y2="125"/>
      <line x1="170" y1="130" x2="170" y2="125"/>
      <line x1="20" y1="100" x2="25" y2="100"/>
      <line x1="20" y1="70" x2="25" y2="70"/>
      <line x1="20" y1="40" x2="25" y2="40"/>
    </g>
    
    <!-- Data Points -->
    <g fill="#0891b2" opacity="0.6">
      <circle cx="30" cy="120" r="1.5"/>
      <circle cx="35" cy="115" r="1.5"/>
      <circle cx="45" cy="110" r="1.5"/>
      <circle cx="55" cy="100" r="1.5"/>
      <circle cx="65" cy="90" r="1.5"/>
      <circle cx="75" cy="80" r="1.5"/>
      <circle cx="85" cy="70" r="1.5"/>
      <circle cx="95" cy="65" r="1.5"/>
      <circle cx="105" cy="60" r="1.5"/>
      <circle cx="115" cy="58" r="1.5"/>
      <circle cx="125" cy="60" r="1.5"/>
      <circle cx="135" cy="65" r="1.5"/>
      <circle cx="145" cy="75" r="1.5"/>
      <circle cx="155" cy="85" r="1.5"/>
      <circle cx="165" cy="100" r="1.5"/>
    </g>
    
    <!-- Capability Envelope -->
    <path d="M30,120 Q50,100 75,80 Q100,55 125,60 Q150,65 165,100" 
          stroke="#ef4444" stroke-width="3" fill="none" opacity="0.9"/>
    
    <!-- Labels -->
    <text x="100" y="145" text-anchor="middle" fill="#374151" font-size="10">Speed (RPM)</text>
    <text x="10" y="80" text-anchor="middle" fill="#374151" font-size="10" transform="rotate(-90, 10, 80)">Torque (kNm)</text>
    <text x="100" y="15" text-anchor="middle" fill="#374151" font-size="12" font-weight="bold">Capability Envelope</text>
  </g>
  
  <!-- Heatmap Section -->
  <g transform="translate(30, 220)">
    <rect x="0" y="0" width="120" height="50" fill="#ffffff" rx="4" opacity="0.9"/>
    <text x="60" y="15" text-anchor="middle" fill="#374151" font-size="10" font-weight="bold">Operational Heatmap</text>
    
    <!-- Heatmap Grid -->
    <g opacity="0.8">
      <rect x="10" y="20" width="8" height="8" fill="#fef3c7"/>
      <rect x="18" y="20" width="8" height="8" fill="#fde68a"/>
      <rect x="26" y="20" width="8" height="8" fill="#f59e0b"/>
      <rect x="34" y="20" width="8" height="8" fill="#d97706"/>
      <rect x="42" y="20" width="8" height="8" fill="#92400e"/>
      
      <rect x="10" y="28" width="8" height="8" fill="#fde68a"/>
      <rect x="18" y="28" width="8" height="8" fill="#f59e0b"/>
      <rect x="26" y="28" width="8" height="8" fill="#d97706"/>
      <rect x="34" y="28" width="8" height="8" fill="#92400e"/>
      <rect x="42" y="28" width="8" height="8" fill="#451a03"/>
      
      <rect x="60" y="20" width="50" height="16" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
      <text x="85" y="30" text-anchor="middle" fill="#374151" font-size="8">Statistics</text>
    </g>
  </g>
  
  <!-- Title -->
  <text x="200" y="285" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    Wind Turbine Capability Analysis
  </text>
</svg>
